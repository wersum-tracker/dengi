<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Деньги с нуля</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: обложка-«банкнота» + вертикальный маршрут модулей; урок показывается по одному шагу-карточке */
:root{
  --paper:#F3F5F0; --card:#FFFFFF; --ink:#15233A; --muted:#55607A; --line:#D8DDD3; --note-bg:#EDF0F5;
  --accent:#0B7A64; --accent-ink:#FFFFFF; --accent-soft:#DCEFE8; --accent-text:#08614F;
  --gold:#C98A12; --gold-soft:#FBEFD3; --gold-ink:#7E5300;
  --anya:#0B7A64; --anya-text:#08614F; --borya:#C2552E; --borya-soft:#F8E3DA; --borya-text:#9C3D1B;
  --good:#1E8549; --good-soft:#DFF2E6; --bad:#BF3A33; --bad-soft:#FAE2DF;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Onest","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E151D; --card:#16202B; --ink:#E7ECF1; --muted:#9AA7B6; --line:#2A3746; --note-bg:#1C2734;
    --accent:#38C3A2; --accent-ink:#04241D; --accent-soft:#123A31; --accent-text:#6FDCC0;
    --gold:#F0B33F; --gold-soft:#3A2B0E; --gold-ink:#F4C46A;
    --anya:#38C3A2; --anya-text:#6FDCC0; --borya:#F08A62; --borya-soft:#3D2016; --borya-text:#F5A688;
    --good:#4FCB82; --good-soft:#12301F; --bad:#F27D74; --bad-soft:#3B1917;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E151D; --card:#16202B; --ink:#E7ECF1; --muted:#9AA7B6; --line:#2A3746; --note-bg:#1C2734;
  --accent:#38C3A2; --accent-ink:#04241D; --accent-soft:#123A31; --accent-text:#6FDCC0;
  --gold:#F0B33F; --gold-soft:#3A2B0E; --gold-ink:#F4C46A;
  --anya:#38C3A2; --anya-text:#6FDCC0; --borya:#F08A62; --borya-soft:#3D2016; --borya-text:#F5A688;
  --good:#4FCB82; --good-soft:#12301F; --bad:#F27D74; --bad-soft:#3B1917;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:var(--accent-text)}
b,strong{font-weight:700}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.eyebrow{display:block;font:500 11px/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:700 15px/1 var(--f-display);color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.brand span{color:var(--accent-text)}
.coins{display:inline-flex;align-items:center;gap:6px;font:700 15px/1 var(--f-mono);color:var(--gold-ink);background:var(--gold-soft);padding:5px 12px 5px 5px;border-radius:999px}
.coins svg{width:22px;height:22px;flex:none}
.coins.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.14)}}

.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 80px}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 15px/1.1 var(--f-body);padding:13px 20px;border-radius:12px;border:1px solid transparent;cursor:pointer;text-decoration:none;transition:transform .15s,background .15s,border-color .15s}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover:not(:disabled){border-color:var(--accent)}
.btn.small{padding:9px 14px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input[type=text]:focus,input[type=number]:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);margin:6px 0}
textarea{min-height:96px;resize:vertical}
.bar{height:8px;background:var(--accent-soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width .6s ease}
.bar.gold{background:var(--card)}
.bar.gold i{background:var(--gold)}

/* hero banknote */
.note{position:relative;overflow:hidden;background:var(--card);border-radius:20px;border:1px solid var(--line);box-shadow:inset 0 0 0 8px var(--card),inset 0 0 0 9px var(--accent-soft);padding:clamp(24px,4vw,44px);min-height:320px}
.note canvas{position:absolute;right:-20px;top:50%;width:360px;height:360px;transform:translateY(-50%);pointer-events:none}
.note-in{position:relative;z-index:1;max-width:560px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.note-top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.serial{font:700 13px/1 var(--f-mono);color:var(--borya-text);letter-spacing:.16em}
.note h1{font:700 clamp(36px,6.4vw,64px)/.98 var(--f-display);margin:0;letter-spacing:-.03em;text-wrap:balance}
.note-sub{margin:0;color:var(--muted);max-width:46ch;font-size:17px}
.owner{display:flex;align-items:baseline;gap:12px;border-bottom:1.5px dashed var(--line);max-width:380px}
.owner span{font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);flex:none}
.owner input{flex:1;min-width:0;border:0;background:transparent;font:600 18px/1.2 var(--f-body);color:var(--ink);padding:6px 0;border-radius:0}
.owner input:focus{outline:none}
.owner:focus-within{border-bottom-color:var(--accent)}
.note-prog{display:grid;gap:6px;max-width:380px}
.note-prog span{font-size:14px;color:var(--muted)}
.note .btn{justify-self:start}
.denom{position:absolute;right:clamp(20px,3.2vw,36px);bottom:clamp(16px,3vw,28px);z-index:1;text-align:right;pointer-events:none}
.denom b{display:block;font:700 clamp(52px,8vw,92px)/.85 var(--f-display);color:var(--accent);letter-spacing:-.05em}
.denom span{font:500 11px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
@media (max-width:680px){
  .note{padding-bottom:110px}
  .note canvas{width:250px;height:250px;right:-80px;top:-50px;transform:none;opacity:.4}
}

/* goal */
.goal{margin-top:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,300px);gap:14px 28px;align-items:center;background:var(--gold-soft);border-radius:16px;padding:18px 22px}
.goal.empty{grid-template-columns:1fr}
.goal h2{font:500 22px/1.2 var(--f-display);margin:6px 0 4px;overflow-wrap:anywhere}
.goal p{margin:0}
.goal .eyebrow{color:var(--gold-ink)}
.goal-prog{display:grid;gap:6px}
.goal-prog label{font-size:13px;color:var(--muted)}
@media (max-width:640px){.goal{grid-template-columns:1fr}}

/* route */
.route-sec{margin-top:44px}
.sec-h{font:500 26px/1.15 var(--f-display);margin:0;letter-spacing:-.01em}
.sec-sub{color:var(--muted);margin:6px 0 22px;max-width:60ch}
.route{list-style:none;margin:0;padding:0}
.station{display:grid;grid-template-columns:48px minmax(0,1fr);column-gap:16px;position:relative}
.station::before{content:"";position:absolute;left:23px;top:48px;bottom:0;width:2px;background:var(--line)}
.station:last-child::before{display:none}
.marker{grid-row:1 / span 2;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font:700 16px/1 var(--f-display);background:var(--card);border:2px solid var(--line);color:var(--muted);position:relative;z-index:1}
.marker svg{width:16px;height:16px}
.station.open .marker{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-ink)}
.station.complete .marker{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.st-body{padding-top:2px;min-width:0}
.st-body h3{font:500 19px/1.25 var(--f-display);margin:4px 0 4px}
.station.locked .st-body h3{color:var(--muted)}
.st-q{margin:0;color:var(--muted);max-width:60ch}
.st-extra{margin:6px 0 0;font-weight:600;color:var(--gold-ink)}
.st-bridge{grid-column:2;color:var(--muted);font-size:14px;font-style:italic;padding:12px 0 22px;display:flex;gap:8px;max-width:60ch}
.st-bridge::before{content:"↓";font-style:normal;font-weight:700;color:var(--gold-ink)}
.station:last-child .st-body{padding-bottom:8px}
.lessons{display:grid;gap:8px;margin-top:12px;max-width:560px}
.lesson-btn{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.lesson-btn:hover{border-color:var(--accent);transform:translateX(3px)}
.lesson-btn .ln{font:700 13px/1 var(--f-mono);color:var(--accent-text);min-width:28px}
.lesson-btn .lt{font-weight:600}
.lesson-btn .ls{font-size:13px;color:var(--muted);white-space:nowrap}
.lesson-btn.is-done .ls{color:var(--good);font-weight:600}
.lesson-btn.is-next{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.soon{display:inline-block;margin-top:10px;font:500 12px/1 var(--f-mono);letter-spacing:.06em;color:var(--muted);border:1px dashed var(--line);border-radius:99px;padding:7px 11px}

.parents{margin-top:40px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 20px}
.parents summary{cursor:pointer;font-weight:600;padding:14px 0}
.parents ul{margin:0 0 14px;padding-left:20px;display:grid;gap:6px;max-width:70ch}
.parents p{max-width:70ch;color:var(--muted);font-size:14px}
.parents .btn{margin-bottom:16px}

/* lesson */
.lesson{max-width:740px;margin:0 auto}
.l-head{display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;align-items:center}
.back{color:var(--accent-text);text-decoration:none;font-weight:600;font-size:14px}
.l-meta{font:500 12px/1.3 var(--f-mono);color:var(--muted);letter-spacing:.06em}
.l-title{font:700 clamp(28px,4.8vw,40px)/1.08 var(--f-display);margin:14px 0 18px;letter-spacing:-.025em;text-wrap:balance}
.segs{list-style:none;display:flex;gap:4px;margin:0 0 18px;padding:0}
.seg{flex:1;height:6px;border-radius:99px;background:var(--line)}
.seg.done{background:var(--accent)}
.seg.now{background:var(--gold)}
.step{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(20px,4vw,34px);animation:stepIn .35s ease both}
@keyframes stepIn{from{opacity:0;transform:translateY(10px)}}
.chip{display:inline-block;font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;padding:7px 11px;border-radius:99px;background:var(--accent-soft);color:var(--accent-text)}
.k-hook .chip,.k-mission .chip{background:var(--gold-soft);color:var(--gold-ink)}
.k-play .chip{background:var(--borya-soft);color:var(--borya-text)}
.k-example .chip,.k-sheet .chip,.k-bridge .chip{background:var(--note-bg);color:var(--ink)}
.step h2{font:500 clamp(21px,3.4vw,27px)/1.2 var(--f-display);margin:14px 0 14px;letter-spacing:-.01em;text-wrap:balance}
.step h2:focus{outline:none}
.step-body>p,.step-body .list{max-width:65ch}
.step-body p{margin:0 0 12px}
.lead{font-size:18px}
.list{padding-left:22px;display:grid;gap:6px;margin:0 0 14px}
.lnav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.gate-hint{font-size:13px;color:var(--muted);text-align:center;flex:1}
.callout{background:var(--accent-soft);border-radius:14px;padding:16px 18px;margin:16px 0;max-width:65ch}
.callout.warn{background:var(--borya-soft)}
.callout.warn>b:first-child{color:var(--borya-text)}
.tbl-wrap{overflow-x:auto;margin:6px 0 4px}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:420px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 11px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
td.y{color:var(--good);font-weight:700}
td.n{color:var(--bad);font-weight:700}
.token{width:48px;height:48px;border-radius:50%;display:inline-grid;place-items:center;font-size:25px;background:var(--card);border:2px solid var(--gold);flex:none;line-height:1}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:14px 0}
.card{background:var(--paper);border-radius:14px;padding:16px;display:grid;gap:8px;align-content:start}
.card h3{font:700 16px/1.3 var(--f-body);margin:0}
.card p{margin:0;font-size:15px}
.card .token{width:42px;height:42px;font-size:21px}
.card .tag{font-size:13px;color:var(--muted)}
.next-card{display:grid;gap:4px;background:var(--accent-soft);border-radius:14px;padding:16px 18px;margin-top:16px}
.next-card b{font:500 18px/1.25 var(--f-display)}
.chain{display:flex;flex-wrap:wrap;gap:8px 4px;align-items:center;margin-top:8px}
.chain .c{font-size:14px;font-weight:600;padding:6px 11px;border-radius:99px;background:var(--paper);border:1px solid var(--line)}
.chain .c.here{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chain .arr{color:var(--muted);font-size:13px}

/* duo / life */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 16px}
@media (max-width:540px){.duo{grid-template-columns:1fr}}
.who{background:var(--paper);border-radius:14px;padding:14px 16px;display:grid;gap:8px;align-content:start;min-width:0}
.who-h{display:flex;align-items:center;gap:10px}
.ava{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 15px/1 var(--f-display);color:var(--card);flex:none}
.who.a .ava{background:var(--anya)}
.who.b .ava{background:var(--borya)}
.who p{margin:0}
.who .ev{min-height:4.6em}
.bal{font:700 24px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.who.a .bal{color:var(--anya-text)}
.who.b .bal{color:var(--borya-text)}
.life-ctrl{display:grid;gap:4px;margin-top:6px}
.life-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ticks{display:flex;justify-content:space-between;font:500 12px/1 var(--f-mono);color:var(--muted);padding:0 2px}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.chart .ax{fill:var(--muted);font:500 11px var(--f-mono)}
.chart .ax.cur{fill:var(--ink);font-weight:700}
.chart .ln-a{fill:none;stroke:var(--anya);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .ln-b{fill:none;stroke:var(--borya);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .pt-a{fill:var(--anya)}
.chart .pt-b{fill:var(--borya)}
.chart .lab-a{fill:var(--anya-text);font:700 12px var(--f-body)}
.chart .lab-b{fill:var(--borya-text);font:700 12px var(--f-body)}

/* calculators */
.calc-out{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.calc-out>div{background:var(--paper);border-radius:12px;padding:12px 14px;min-width:0}
.calc-out b{display:block;font:700 21px/1.15 var(--f-mono);margin-top:6px;font-variant-numeric:tabular-nums}
.calc-items{list-style:none;padding:0;margin:8px 0 6px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.calc-items li{background:var(--gold-soft);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px}
.calc-items b{font-family:var(--f-mono);color:var(--gold-ink);white-space:nowrap}

/* hooks */
.hook-vis{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 20px}
.no-rub{position:relative;font:700 104px/1 var(--f-display);color:var(--muted);padding:0 20px}
.no-rub::after{content:"";position:absolute;left:0;right:0;top:50%;height:9px;background:var(--bad);transform:rotate(-22deg);border-radius:5px}
.bill{position:relative;width:min(100%,380px);aspect-ratio:2.1/1;margin:8px auto 20px;border-radius:12px;border:1.5px solid var(--accent);background:repeating-radial-gradient(circle at 28% 50%,transparent 0 7px,color-mix(in srgb,var(--accent) 16%,transparent) 7px 8px),var(--accent-soft);display:grid;place-items:center;text-align:center}
.bill-c b{display:block;font:700 46px/1 var(--f-display);color:var(--accent-text);letter-spacing:-.03em}
.bill-c span{font:500 12px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--accent-text)}
.bill-k{position:absolute;font:700 16px/1 var(--f-display);color:var(--accent-text)}
.bill-k.k-tl{left:12px;top:10px}
.bill-k.k-br{right:12px;bottom:10px}

/* barter visual */
.sv{position:relative;width:min(100%,340px);height:96px;margin:18px auto 6px}
.sv .token{position:absolute;top:0}
.sv .t1{left:0;animation:svR 4s ease-in-out infinite}
.sv .t2{right:0;animation:svL 4s ease-in-out infinite}
@keyframes svR{0%,25%{left:0}50%,75%{left:calc(100% - 48px)}100%{left:0}}
@keyframes svL{0%,25%{right:0}50%,75%{right:calc(100% - 48px)}100%{right:0}}
.sv-labels{display:flex;justify-content:space-between;width:min(100%,340px);margin:0 auto 14px;font-size:14px;color:var(--muted)}

/* barter game */
.bt-status{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;background:var(--note-bg);border-radius:14px;padding:12px 14px}
.hand{display:flex;align-items:center;gap:10px}
.token.swap{animation:swap .5s ease}
@keyframes swap{50%{transform:rotateY(90deg) scale(.8)}}
.suns{display:flex;gap:4px;margin-top:5px}
.sun{width:11px;height:11px;border-radius:50%;background:var(--gold)}
.sun.off{background:var(--line)}
.traders{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px;margin-top:12px}
.trader{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit;color:var(--ink);display:grid;gap:3px;align-content:start}
.trader:hover:not(:disabled){border-color:var(--accent)}
.trader:disabled{cursor:default}
.trader .row{font-size:14px;color:var(--muted)}
.trader .row span{color:var(--ink)}
.trader.used{opacity:.5}
.trader .doneTag{font-size:12px;color:var(--good);font-weight:600}
.nope{animation:shake .38s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bt-log{min-height:52px;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--note-bg);font-size:15px}
.bt-log.ok{background:var(--good-soft)}
.bt-log.no{background:var(--bad-soft)}
.bt-actions{margin-top:10px}

/* timeline */
.tl-wrap{overflow-x:auto;margin:4px -6px 0;padding:6px}
.tl{display:flex;gap:6px;min-width:540px;position:relative}
.tl::before{content:"";position:absolute;left:40px;right:40px;top:28px;height:2px;background:var(--line)}
.tl-dot{flex:1;display:grid;justify-items:center;gap:6px;background:none;border:0;cursor:pointer;font:inherit;color:var(--muted);padding:0;position:relative}
.tl-ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--card);border:2px solid var(--line);transition:transform .2s,border-color .2s}
.tl-ic.rub{font:700 24px/1 var(--f-display);color:var(--accent-text)}
.tl-dot.past .tl-ic{border-color:var(--accent)}
.tl-dot.on .tl-ic{border-color:var(--gold);background:var(--gold-soft);transform:scale(1.08)}
.tl-dot.on{color:var(--ink);font-weight:700}
.tl-w{font-size:12px}
.tl-card{background:var(--paper);border-radius:14px;padding:16px 18px;margin-top:12px;animation:stepIn .3s ease both}
.tl-card h3{font:500 20px/1.2 var(--f-display);margin:6px 0 8px}
.tl-card p{margin:0 0 10px}
.fact{background:var(--gold-soft);border-radius:10px;padding:10px 12px;font-size:15px}
.tl-nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}

/* order game */
.ord-slots{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.ord-slots li{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;border:1.5px dashed var(--line);color:var(--muted)}
.ord-slots li.fill{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:600}
.ord-pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.ord-b,.pill{font:inherit;font-size:15px;font-weight:600;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.ord-b:hover,.pill:hover{border-color:var(--accent)}
.ord-b.nope{border-color:var(--bad)}
.msg{min-height:1.5em;margin:12px 0 0}
.msg.ok{color:var(--good);font-weight:600}
.msg.no{color:var(--bad)}

/* quiz */
.q{font-size:19px;font-weight:600;margin:0 0 16px;max-width:60ch}
.opts{display:grid;gap:10px}
.opt{text-align:left;font:inherit;font-size:16px;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled:not(.right):not(.wrong){opacity:.55}
.explain{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--note-bg);max-width:65ch}
.explain.ok b:first-child{color:var(--good)}
.explain.no b:first-child{color:var(--bad)}

/* mission */
.tasks{padding:0;list-style:none;display:grid;gap:10px;margin:14px 0}
.tasks li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;background:var(--gold-soft);border-radius:12px;padding:12px 14px}
.tasks li::before{content:"→";font-weight:700;color:var(--gold-ink)}
.notes-l{display:block;font-weight:600;margin:4px 0 6px}
.done-check{display:inline-flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;margin-top:12px}
.done-check input{width:22px;height:22px;accent-color:var(--accent)}
.goalf{display:grid;gap:12px;background:var(--paper);border-radius:14px;padding:16px;margin:12px 0 4px}
.goalf label{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
.gf-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:440px){.gf-2{grid-template-columns:1fr}}
.gf-out{margin:0}
.goalf .btn{justify-self:start}

/* sheet */
.sheet{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sheet-row{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:14px;padding:13px 16px;border-bottom:1px solid var(--line)}
.sheet-row:last-child{border-bottom:0}
.sheet-row b{font:500 14px/1.4 var(--f-display)}
.sheet-row p{margin:0}
@media (max-width:540px){.sheet-row{grid-template-columns:1fr;gap:4px}}

/* sorter / pizza / printer */
.so-card{background:var(--paper);border-radius:14px;padding:16px 18px}
.so-sit{font-size:18px;font-weight:600;margin:8px 0 14px}
.so-btns{display:flex;flex-wrap:wrap;gap:8px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.pz-out{background:var(--paper);border-radius:14px;padding:16px 18px}
.pz-eq{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;font-size:17px}
.pz-eq b{font:700 22px/1.15 var(--f-mono)}
.pz-icons{font-size:22px;line-height:1.45;margin-top:10px;overflow-wrap:anywhere;animation:stepIn .3s ease both}
.mp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:12px 0}
.mp-grid>div{background:var(--paper);border-radius:12px;padding:12px 14px;display:grid;gap:8px;align-content:start;min-width:0}
.mp-pz{font-size:19px;letter-spacing:1px;line-height:1.35}
.mp-grid b{font:700 20px/1.1 var(--f-mono)}
.mp-price b{font-size:30px;color:var(--borya-text)}
.tick{animation:bump .4s ease}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);font-weight:600;font-size:15px;padding:11px 18px;border-radius:99px;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.2);white-space:nowrap}
.toast.show{animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<script>
/* ---------- утилиты ---------- */
const $=(s,r=document)=>r.querySelector(s);
const fmt=n=>Math.round(n).toLocaleString('ru-RU');
const rub=n=>fmt(n)+' ₽';
const signed=n=>n>0?'+'+rub(n):n<0?'−'+rub(-n):rub(0);
function plural(n,f){n=Math.abs(Math.round(n))%100;const d=n%10;if(n>10&&n<20)return f[2];if(d>1&&d<5)return f[1];if(d===1)return f[0];return f[2];}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const reduceMotion=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- состояние (только в этом браузере) ---------- */
const KEY='dengi-s-nulya.v1';
let S={name:'',coins:0,done:{},quiz:{},gates:{},missions:{},mcoins:{},goal:null,saved:0,notes:{},pos:{}};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

function updateCoins(bump){const el=$('#coin-n');el.textContent=fmt(S.coins);if(bump){const p=el.parentElement;p.classList.remove('bump');void p.offsetWidth;p.classList.add('bump');}}
let toastT;
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;el.classList.remove('show');void el.offsetWidth;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true;},2300);}
function addCoins(n,why){S.coins+=n;save();updateCoins(true);toast('+'+n+' '+plural(n,['монета','монеты','монет'])+(why?' · '+why:''));}

/* ---------- структура курса ---------- */
const ORDER=['intro','m1-1','m1-2','m1-3'];
const TOTAL=36;
const PLAY_ICON='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9.5-5.5z" fill="currentColor"/></svg>';
const MODULES=[
 {n:0,title:'Зачем мне это?',q:'Почему одинаковые деньги приводят к разной жизни.',lessons:['intro'],bridge:'Прежде чем копить и тратить, разберёмся: что такое деньги?'},
 {n:1,title:'Что такое деньги',q:'Почему за бумажку или цифры в телефоне дают настоящие вещи?',lessons:['m1-1','m1-2','m1-3'],bridge:'Деньги нужны всем. Но откуда они берутся у конкретного человека?'},

 {n:3,title:'Куда уходят деньги',q:'Как тратить так, чтобы потом не жалеть?',count:3,bridge:'Желаний всегда больше, чем денег. Как решить, на что их хватит?'},
 {n:4,title:'Бюджет и цели',q:'Как сделать, чтобы денег хватало на важное?',count:3,bridge:'Деньги в копилке тихо дешевеют. Почему?'},
 {n:5,title:'Инфляция и банк',q:'Почему деньги дешевеют и где их лучше хранить?',count:4,bridge:'Банк даёт твои деньги в долг другим. А каково быть тем, кто занимает?'},
 {n:6,title:'Долги и кредиты',q:'Когда занимать нормально, а когда это ловушка?',count:3,bridge:'Некоторые хотят забрать твои деньги не процентами, а обманом.'},
 {n:7,title:'Финансовая безопасность',q:'Как не потерять то, что заработал?',count:4,bridge:'Ты умеешь зарабатывать, копить и защищать деньги. Как сделать, чтобы они работали сами?'},
 {n:8,title:'Инвестиции',q:'Как деньги начинают работать на тебя?',count:3,bridge:'Что на самом деле значит «купить акцию»?'},
 {n:9,title:'Фондовый рынок',q:'Акции, облигации, биржа: что значит «купить кусочек компании»?',count:5,bridge:'Как собрать всё это в один план на жизнь?'},
 {n:10,title:'Мой финансовый план',q:'Как собрать всё в план на жизнь.',count:3,extra:'Финальная игра «Жизнь за 30 минут»'},

/* ---------- данные интерактивов ---------- */
const LIFE=[
 {age:14,a:{t:'Из 3 000 ₽ карманных сразу откладывает 500 ₽ в копилку.',b:0},b:{t:'Тратит всё в первые дни: перекусы, донаты в игры.',b:0}},
 {age:16,a:{t:'Летом подрабатывает и половину заработка добавляет в копилку.',b:40000},b:{t:'До карманных не хватает. Занимает у друзей.',b:-3000}},
 {age:18,a:{t:'Покупает ноутбук для учёбы на свои деньги. Без долгов.',b:15000},b:{t:'Берёт телефон за 80 000 ₽ в кредит. С процентами отдаст около 100 000 ₽.',b:-100000}},

 {age:22,a:{t:'Первая работа. С каждой зарплаты сразу откладывает 15%.',b:130000},b:{t:'Зарплата такая же, как у Ани, но почти четверть уходит на долги.',b:-80000}},
 {age:24,a:{t:'Запас на полгода жизни, первые инвестиции и поездка, о которой мечтала.',b:320000},b:{t:'Всё ещё платит долги. Запаса нет, поездка откладывается.',b:-30000}},
];

/* ---------- интерактивы ---------- */
function mountLife(el){
 el.innerHTML=`<div class="life-ctrl">
   <div class="life-row"><label for="age-range">Возраст: <b id="age-v"></b></label><button class="btn ghost small" id="life-play" type="button">▶ Запустить 10 лет</button></div>
   <input type="range" id="age-range" min="0" max="5" step="1" value="0" aria-describedby="age-v">
   <div class="ticks" aria-hidden="true">${LIFE.map(d=>`<span>${d.age}</span>`).join('')}</div>
 </div>
 <div class="duo">
   <div class="who a"><div class="who-h"><span class="ava">А</span><b>Аня</b></div><p class="ev" id="a-t"></p><span class="eyebrow" id="a-l"></span><div class="bal" id="a-b"></div></div>
   <div class="who b"><div class="who-h"><span class="ava">Б</span><b>Боря</b></div><p class="ev" id="b-t"></p><span class="eyebrow" id="b-l"></span><div class="bal" id="b-b"></div></div>
 </div>
 <svg class="chart" id="life-chart" viewBox="0 0 640 250" role="img" aria-label="График: накопления Ани и долги Бори с 14 до 24 лет"></svg>
 <p class="small muted">Цифры примерные: важна разница, а не точные суммы.</p>`;
 const r=$('#age-range',el),play=$('#life-play',el);let timer=null;
 function upd(){const i=+r.value,d=LIFE[i];
  $('#age-v',el).textContent=d.age+' '+plural(d.age,['год','года','лет']);
  $('#a-t',el).textContent=d.a.t;$('#b-t',el).textContent=d.b.t;
  $('#a-l',el).textContent=d.a.b>0?'Накоплено':'Пока ничего';
  $('#b-l',el).textContent=d.b.b<0?'Долг':'Долгов нет';
  $('#a-b',el).textContent=signed(d.a.b);$('#b-b',el).textContent=signed(d.b.b);
  drawLife($('#life-chart',el),i);}
 function stop(){if(timer){clearInterval(timer);timer=null;}play.textContent='▶ Запустить 10 лет';}
 r.addEventListener('input',()=>{stop();upd();});
 play.onclick=()=>{if(timer){stop();return;}if(+r.value>=5)r.value=0;upd();play.textContent='❚❚ Пауза';
  timer=setInterval(()=>{if(!document.body.contains(r)||+r.value>=5){stop();return;}r.value=+r.value+1;upd();},1300);};
 upd();
}
function drawLife(svg,idx){
 const W=Math.max(300,Math.round(svg.getBoundingClientRect().width)||640),narrow=W<480;
 const H=250,L=48,R=narrow?14:24,T=26,B=30,min=-150000,max=350000;
 svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
 const x=i=>L+i*(W-L-R)/5,y=v=>T+(max-v)/(max-min)*(H-T-B);
 let s=`<text x="4" y="12" class="ax">тыс. ₽</text>`;
 [300000,200000,100000,0,-100000].forEach(v=>{
  s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="${v===0?'zero':'grid'}"/>`;
  s+=`<text x="${L-8}" y="${y(v)+4}" text-anchor="end" class="ax">${v===0?'0':(v>0?'+':'−')+fmt(Math.abs(v)/1000)}</text>`;});
 LIFE.forEach((d,i)=>{s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" class="ax${i===idx?' cur':''}">${d.age}${narrow?'':' '+plural(d.age,['год','года','лет'])}</text>`;});
 const pts=k=>LIFE.slice(0,idx+1).map((d,i)=>`${x(i)},${y(d[k].b)}`).join(' ');
 if(idx>0)s+=`<polyline points="${pts('a')}" class="ln-a"/><polyline points="${pts('b')}" class="ln-b"/>`;
 LIFE.slice(0,idx+1).forEach((d,i)=>{const r=i===idx?6:4;s+=`<circle cx="${x(i)}" cy="${y(d.a.b)}" r="${r}" class="pt-a"/><circle cx="${x(i)}" cy="${y(d.b.b)}" r="${r}" class="pt-b"/>`;});
 if(idx>0){const xe=x(idx);s+=`<text x="${xe-10}" y="${y(LIFE[idx].a.b)-12}" text-anchor="end" class="lab-a">Аня</text><text x="${xe-10}" y="${y(LIFE[idx].b.b)+20}" text-anchor="end" class="lab-b">Боря</text>`;}
 svg.innerHTML=s;
}

function mountSpend(el){
 const ITEMS=[['🎧','Беспроводные наушники',9000],['👟','Кроссовки',8000],['🚲','Велосипед',30000],['🏖️','Поездка на море',60000]];

 r.addEventListener('input',upd);upd();

function mountGoal(el){
 const g=S.goal||{};
 el.innerHTML=`<form class="goalf" id="goal-form" novalidate>
  <div><label for="g-item">Что хочу купить</label><input id="g-item" type="text" maxlength="40" placeholder="Например, наушники"></div>
  <div class="gf-2"><div><label for="g-price">Сколько стоит, ₽</label><input id="g-price" type="number" inputmode="numeric" min="100" step="100" placeholder="9000"></div>
  <div><label for="g-weeks">За сколько недель накоплю</label><input id="g-weeks" type="number" inputmode="numeric" min="1" max="104" placeholder="12"></div></div>
  <p class="gf-out" id="g-out" aria-live="polite"></p>
  <button class="btn primary" type="submit">Сохранить цель</button>
  <p class="small" id="g-saved" aria-live="polite" style="margin:0"></p></form>`;
 const it=$('#g-item',el),pr=$('#g-price',el),wk=$('#g-weeks',el),out=$('#g-out',el),sv=$('#g-saved',el);
 if(g.item){it.value=g.item;pr.value=g.price;wk.value=g.weeks;sv.textContent='Цель сохранена. Она есть на карте курса.';}
 const weekly=(p,w)=>Math.ceil(p/w/10)*10;
 function calc(){const p=+pr.value,w=+wk.value;
  if(p>0&&w>0){const k=weekly(p,w);out.innerHTML=`Нужно откладывать <b>${rub(k)}</b> в неделю. Это примерно ${rub(Math.round(k*52/12/10)*10)} в месяц.`;}
  else out.innerHTML='<span class="muted">Например: наушники за 9 000 ₽ за 12 недель — это 750 ₽ в неделю.</span>';}
 [it,pr,wk].forEach(i=>i.addEventListener('input',calc));calc();
 $('#goal-form',el).addEventListener('submit',e=>{e.preventDefault();
  const name=it.value.trim(),p=Math.round(+pr.value),w=Math.round(+wk.value);
  if(!name){sv.textContent='Напиши, что хочешь купить.';it.focus();return;}
  if(!(p>=100)){sv.textContent='Укажи цену: от 100 ₽.';pr.focus();return;}
  if(!(w>=1&&w<=104)){sv.textContent='Срок: от 1 до 104 недель.';wk.focus();return;}
  const first=!S.goal;S.goal={item:name,price:p,weeks:w,weekly:weekly(p,w)};save();
  sv.textContent='Цель сохранена. Она появилась на карте курса.';if(first)addCoins(15,'цель выбрана');});

function mountBarter(el,api){
 const IT={fish:['🐟','Рыба'],bread:['🍞','Хлеб'],hammer:['🔨','Молоток'],pot:['🏺','Горшок'],milk:['🥛','Молоко'],wood:['🪵','Дрова'],cheese:['🧀','Сыр'],honey:['🍯','Мёд'],shoes:['👟','Кроссовки']};
 const T=[['Пекарь','Пекарю','bread','fish'],['Кузнец','Кузнецу','hammer','fish'],['Гончар','Гончару','pot','bread'],['Пастух','Пастуху','milk','honey'],['Дровосек','Дровосеку','wood','pot'],['Сыровар','Сыровару','cheese','milk'],['Пчеловод','Пчеловоду','honey','wood'],['Сапожник','Сапожнику','shoes','honey']];
 const MAX=8;let hand,moves,used,trades,over;
 const it=k=>IT[k][0]+' '+IT[k][1];
 function draw(){
  el.innerHTML=`<div class="bt-status">
   <div class="hand"><span class="token" id="tok">${IT[hand][0]}</span><div><span class="eyebrow">В руках</span><b>${IT[hand][1]}</b></div></div>
   <div><span class="eyebrow">Цель</span><b>👟 Кроссовки</b></div>
   <div><span class="eyebrow">Ходов до заката: ${moves}</span><div class="suns" aria-hidden="true">${Array.from({length:MAX},(_,i)=>`<i class="sun${i<moves?'':' off'}"></i>`).join('')}</div></div></div>
  <div class="traders">${T.map((t,i)=>`<button type="button" class="trader${used[i]?' used':''}" data-i="${i}" ${used[i]||over?'disabled':''}><b>${t[0]}</b><span class="row">Есть: <span>${it(t[2])}</span></span><span class="row">Хочет: <span>${it(t[3])}</span></span>${used[i]?'<span class="doneTag">Обмен состоялся</span>':''}</button>`).join('')}</div>
  <div class="bt-log" id="bt-log" aria-live="polite"></div>
  <div class="bt-actions"><button type="button" class="btn ghost small" id="bt-reset">Начать заново</button></div>`;
  el.querySelectorAll('.trader').forEach(b=>b.onclick=()=>tryTrade(+b.dataset.i));
  $('#bt-reset',el).onclick=reset;}
 function log(t,c){const l=$('#bt-log',el);l.className='bt-log'+(c?' '+c:'');l.innerHTML=t;}
 function reset(){hand='fish';moves=MAX;used={};trades=0;over=false;draw();log('Ты рыбак на рынке. Нажми на торговца, чтобы предложить обмен. Подсказка: подумай с конца, кто отдаст кроссовки и что ему нужно.');}
 function tryTrade(i){if(over)return;const t=T[i];moves--;
  if(t[3]===hand){const old=hand;hand=t[2];used[i]=true;trades++;
   if(hand==='shoes'){over=true;draw();$('#tok',el).classList.add('swap');
    log(`<b>Есть кроссовки!</b> Понадобилось ${trades} ${plural(trades,['обмен','обмена','обменов'])} и ${MAX-moves} ${plural(MAX-moves,['ход','хода','ходов'])}. А теперь представь, что так приходится покупать вообще всё: хлеб, проезд, телефон.`,'ok');api.unlock();return;}
   draw();$('#tok',el).classList.add('swap');
   const anyone=T.some((x,j)=>!used[j]&&x[3]===hand);
   if(!anyone){over=true;draw();log(`<b>Тупик.</b> ${t[0]} забрал ${it(old)} и отдал ${it(hand)}, но этот товар больше никому на рынке не нужен. На рынке без денег такое случалось постоянно. Нажми «Начать заново».`,'no');api.unlock();return;}
   log(`${t[0]} забрал ${it(old)} и отдал тебе ${it(hand)}.`);
  }else{draw();const b=el.querySelector(`.trader[data-i="${i}"]`);b.classList.add('nope');
   log(`${t[1]} твой товар не нужен: он меняется только на ${it(t[3])}. Ход потрачен.`,'no');}
  if(!over&&moves<=0){over=true;draw();log('<b>Солнце село, рынок закрылся.</b> Кроссовок нет. Попробуй ещё раз и начни с конца: у кого кроссовки и что ему нужно?','no');api.unlock();}
 }
 reset();
}

function mountOrder(el,api){

 let placed=S.gates[api.key]?6:0,mistakes=0;
 function draw(msg,cls){
  el.innerHTML=`<ol class="ord-slots">${RIGHT.map((r,i)=>`<li class="${i<placed?'fill':''}"><span class="mono">${i+1}</span>${i<placed?r:'…'}</li>`).join('')}</ol>
  <div class="ord-pool">${POOL.filter(i=>i>=placed).map(i=>`<button type="button" class="ord-b" data-i="${i}">${RIGHT[i]}</button>`).join('')}</div>
  <p class="msg ${cls||''}" aria-live="polite">${msg||''}</p>${placed<6&&mistakes>=3?'<button type="button" class="btn ghost small" id="ord-show">Показать ответ</button>':''}`;
  el.querySelectorAll('.ord-b').forEach(b=>b.onclick=()=>pick(+b.dataset.i,b));
  const sh=$('#ord-show',el);if(sh)sh.onclick=()=>{placed=6;draw('Вот правильный порядок: от вещей к металлу, от металла к бумаге, от бумаги к цифрам.','ok');api.unlock();};}
 function pick(i,b){
  if(i===placed){placed++;if(placed===6){draw(mistakes===0?'Идеально, ни одной ошибки!':'Готово! Порядок восстановлен.','ok');api.unlock();}else draw('Верно. Что появилось дальше?');}
  else{mistakes++;b.classList.add('nope','no');setTimeout(()=>draw('Не сейчас: это появилось позже. Что было раньше?','no'),380);}}
 draw(placed?'Порядок восстановлен.':'Нажимай на варианты по порядку: что появилось раньше всего?',placed?'ok':'');
}

 {kind:'learn',title:'Тебе 14: что изменилось',html:`<p>14 лет — первый «денежный» день рождения. Вместе с паспортом у тебя появляются новые права:</p>
  <div class="cards">
  <div class="card"><h3>🪪 Паспорт</h3><p>Первый взрослый документ. Без него не открыть свою карту и не устроиться на подработку.</p></div>
  <div class="card"><h3>💳 Своя карта</h3><p>Можно открыть карту на своё имя. Нужно письменное согласие родителей, а банк сообщает им об операциях по карте.</p></div>
  <div class="card"><h3>💼 Подработка</h3><p>Можно работать официально: лёгкая работа в свободное от учёбы время, с согласия родителя и органа опеки. Подробно — в модуле 2.</p></div>
  <div class="card"><h3>🧾 Свои деньги</h3><p>То, что ты заработал сам, по закону можно тратить без разрешения родителей. Это записано в Гражданском кодексе, статья 26.</p></div>
  </div>
  <p>Больше свободы — больше решений, которые принимаешь ты сам. Поэтому разбираться в деньгах нужно сейчас, а не в 18.</p>
  <div class="callout warn"><b>Обратная сторона.</b> Как только у подростка появляется карта, его начинают искать мошенники. Типичное предложение: «Прими на карту перевод и отправь дальше — получишь 2 000 ₽». Так через чужие карты прогоняют украденные деньги. Тех, кто соглашается, называют дропами. Банк блокирует им карты, а с 16 лет за это грозит уголовная статья. Подробно — в модуле 7.</div>`},
 {kind:'quiz',q:'В чате незнакомец пишет: «Прими на свою карту перевод и сразу отправь его по другим реквизитам. За 5 минут — 2 000 ₽». Что это?',opts:['Лёгкая подработка: ничего не покупаешь и не продаёшь','Схема мошенников: через твою карту прогоняют украденные деньги','Обычный перевод, так делают все'],a:1,ex:'Честная работа не требует пропускать чужие деньги через твою карту. Человека, который так делает, называют дропом: банк блокирует ему карты, а с 16 лет это уголовное преступление. Правильно — не отвечать и рассказать взрослым.'},
 {kind:'mission',title:'Выбери свою цель',intro:'Весь курс ты будешь не только читать, но и копить на настоящую вещь. Выбери то, что хочешь купить за 2–4 месяца: наушники, кроссовки, игру или подарок.',mount:mountGoal,
  tasks:['Обсуди с родителями, сколько карманных денег у тебя в месяц и какую часть реально откладывать.','Реши, где будешь хранить отложенное: копилка, конверт или отдельный счёт. Если у тебя есть своя карта, в приложении банка обычно можно завести отдельную «копилку» под цель. Подробно о том, где лучше хранить деньги, — в модуле 5.']},
 {kind:'bridge',title:'Дальше: что такое деньги',html:`<p>Чтобы копить, тратить и приумножать, сначала разберёмся с главным: что такое деньги и почему за бумажку дают настоящие вещи.</p>${nextCard('1.1','Мир без денег',15)}`},
]},

'm1-1':{num:'1.1',module:'Модуль 1. Что такое деньги',title:'Мир без денег',min:15,steps:[
 {kind:'hook',title:'Деньги исчезли',html:`<div class="hook-vis" aria-hidden="true"><span class="no-rub">₽</span></div>
  <p class="lead">Представь: завтра все деньги в мире исчезли. Ни наличных, ни карт, ни банковских приложений.</p>
  <p class="lead">А тебе очень нужны новые кроссовки. <b>Как ты их получишь?</b></p>
  <p class="muted">Подумай, а потом нажми «Дальше». Так люди жили тысячи лет.</p>`},
 {kind:'learn',title:'Бартер: вещь за вещь',html:`<p>Пока денег не было, люди обменивались вещами напрямую. Рыбак отдавал рыбу, а получал зерно. Такой обмен называется <b>бартер</b>.</p>
  <div class="sv" aria-hidden="true"><span class="token t1">🐟</span><span class="token t2">🌾</span></div>
  <div class="sv-labels" aria-hidden="true"><span>Рыбак</span><span>Земледелец</span></div>
  <p>Звучит просто: у тебя есть одно, у соседа другое, вы поменялись. Проверим на практике.</p>`},
 {kind:'play',title:'Игра: рынок без денег',gate:true,html:`<p>Ты рыбак. У тебя есть рыба, а нужны кроссовки. Рынок работает до заката: у тебя <b>8 ходов</b>. Каждый обмен или неудачная попытка — один ход.</p><div class="mount"></div>`,mount:mountBarter},
 {kind:'learn',title:'Почему бартер неудобен',html:`<div class="cards">
  <div class="card"><span class="token" aria-hidden="true">🔍</span><h3>Трудно найти партнёра</h3><p>Нужен человек, у которого есть то, что нужно тебе, и которому нужно то, что есть у тебя. Экономисты называют это «двойным совпадением желаний».</p></div>
  <div class="card"><span class="token" aria-hidden="true">🐄</span><h3>Вещи не делятся</h3><p>Корову не разрежешь на четыре части, чтобы купить сапоги. А 1 000 ₽ легко разменять на десять купюр по 100 ₽.</p></div>
  <div class="card"><span class="token" aria-hidden="true">🐟</span><h3>Вещи портятся</h3><p>Рыба испортится через пару дней. Копить рыбу на кроссовки не получится.</p></div>
  <div class="card"><span class="token" aria-hidden="true">⚖️</span><h3>Непонятно, сколько что стоит</h3><p>Сколько рыб за кроссовки? А сколько горшков? У каждой пары товаров своя «цена».</p></div></div>
  <div class="callout">Людям нужна была одна вещь, которую согласны принять все. Её и назвали <b>деньгами</b>. С деньгами не нужна цепочка обменов: продал рыбу тому, кому она нужна, и купил кроссовки у того, у кого они есть.</div>`},
 {kind:'example',title:'Бартер жив до сих пор',html:`<ul class="list">
  <li>Друзья меняются карточками, наклейками, скинами в играх.</li>
  <li>На сайтах объявлений есть раздел «Обмен»: «меняю велосипед на самокат».</li>
  <li>В России в 1990-е годы денег часто не хватало, и многие заводы выдавали зарплату своей продукцией: посудой, тканью, кирпичом. Люди потом сами меняли эти вещи на еду.</li></ul>
  <div class="callout">Бартер возвращается, когда денег нет или им не доверяют. Во всех остальных случаях деньги удобнее.</div>`},
 {kind:'quiz',q:'Что такое бартер?',opts:['Покупка вещи в кредит','Обмен вещи на вещь без денег','Обмен рублей на доллары'],a:1,ex:'Бартер — прямой обмен товарами или услугами. Деньги в нём не участвуют.'},
 {kind:'quiz',q:'Почему на рынке без денег так трудно получить кроссовки?',opts:['Нужно найти того, у кого есть нужная тебе вещь и кому нужна твоя','Кроссовки тогда ещё не придумали','Торговцы не любят меняться'],a:0,ex:'Это и есть «двойное совпадение желаний». Найти его трудно, поэтому и появляются длинные цепочки обменов.'},
 {kind:'quiz',q:'У тебя есть корова, а сапоги стоят как четверть коровы. В чём проблема?',opts:['Сапожнику не нужно молоко','Корову нельзя разделить на части без потерь','Сапоги дороже коровы'],a:1,ex:'Деньги делятся на любые части: 1 000 ₽ легко разменять на десять купюр по 100 ₽. С коровой так не выйдет.'},
 {kind:'mission',title:'Расспроси старших',tasks:['Спроси родителей, бабушку или дедушку, чем они менялись в детстве: вкладыши от жвачек, марки, значки, наклейки. Как договаривались, что сколько стоит?','Вспомни свой обмен: карточки, скины, вещи. Легко ли было договориться о «цене»?']},
 {kind:'bridge',title:'Дальше: как менялись деньги',html:`<p>Люди устали искать, кому нужна их рыба. Они начали расплачиваться вещами, которые нужны всем: ракушками, солью, мехами, а потом металлом. Как деньги прошли путь от ракушки до приложения в телефоне — в следующем уроке.</p>${nextCard('1.2','Как менялись деньги',15)}`},
]},

'm1-2':{num:'1.2',module:'Модуль 1. Что такое деньги',title:'Как менялись деньги',min:15,steps:[
 {kind:'hook',title:'Что у них общего?',html:`<div class="hook-vis" aria-hidden="true">${['🐚','🧂','🐿️','🪙','💵','📱'].map(x=>`<span class="token">${x}</span>`).join('')}</div>
  <p class="lead">Ракушка, соль, беличья шкурка, монета, бумажка и цифры в телефоне. <b>Что у них общего?</b></p>
  <p class="lead">Все они были деньгами. Пройдём этот путь за пять минут.</p>`},
 {kind:'play',title:'Путешествие во времени',html:`<p>Нажимай на эпохи по очереди или листай кнопкой «Позже».</p><div class="mount"></div>`,mount:mountTimeline},
 {kind:'play',title:'Расставь по порядку',gate:true,html:`<p>Проверь, запомнил ли ты путь денег.</p><div class="mount"></div>`,mount:mountOrder},
 {kind:'learn',title:'Почему деньги менялись',html:`<p>Каждый раз люди искали деньги удобнее прежних:</p>
  <div class="tbl-wrap"><table><thead><tr><th>Форма денег</th><th>Не портятся</th><th>Легко делятся</th><th>Удобно носить</th></tr></thead><tbody>
  <tr><td>Скот и меха</td><td class="n" aria-label="нет">✗</td><td class="n" aria-label="нет">✗</td><td class="n" aria-label="нет">✗</td></tr>
  <tr><td>Монеты</td><td class="y" aria-label="да">✓</td><td class="y" aria-label="да">✓</td><td class="n" aria-label="нет">✗ тяжело, если сумма большая</td></tr>
  <tr><td>Бумажные деньги</td><td class="y" aria-label="да">✓</td><td class="y" aria-label="да">✓</td><td class="y" aria-label="да">✓</td></tr>
  <tr><td>Карты, телефон, цифровой рубль</td><td class="y" aria-label="да">✓</td><td class="y" aria-label="да">✓ до копейки</td><td class="y" aria-label="да">✓ ничего не весят</td></tr>
  </tbody></table></div>
  <div class="callout">Но есть свойство, без которого не работает ни одна форма денег: <b>доверие</b>. Если люди перестанут верить, что деньги примут, не поможет ни металл, ни приложение. Об этом следующий урок.</div>`},
 {kind:'example',title:'Три эпохи в твоём кармане',html:`<p>Загляни в кошелёк и телефон. Монетам как изобретению около 2 700 лет, бумажным деньгам около 1 000 лет, а оплате телефоном чуть больше десяти. И всё это один и тот же рубль.</p>
  <div class="callout"><b>А игровая валюта — это деньги?</b> Внутриигровые монеты похожи на деньги: ими платят, их копят. Но они работают только внутри одной игры, и правила меняет её создатель. Закроется игра — исчезнут и монеты. Рубль принимают по всей стране.</div>`},
 {kind:'quiz',q:'Почему металлические монеты вытеснили меха и скот?',opts:['Металл не портится, легко делится и ценен сам по себе','Монеты красиво блестят','Монеты невозможно потерять'],a:0,ex:'Хорошие деньги не портятся, делятся на части и всегда ценны. Металл подходил под всё это.'},
 {kind:'quiz',q:'Откуда, по самой популярной версии, произошло слово «рубль»?',opts:['От названия реки','От слова «рубить»','От фамилии купца'],a:1,ex:'Серебряный слиток рубили на части, и такой кусок называли рублём.'},
 {kind:'quiz',q:'Какие формы рубля есть сегодня?',opts:['Только наличные','Наличные и безналичные','Наличные, безналичные и цифровые'],a:2,ex:'Цифровой рубль — третья форма. С 1 сентября 2026 года им можно пользоваться через крупнейшие банки.'},
 {kind:'mission',title:'Археология денег',tasks:['Найди дома самую старую монету или купюру. Какой на ней год? Что изображено?','Спроси у старших, сколько стоили хлеб и мороженое, когда они были в твоём возрасте. Запиши ответы ниже: они пригодятся в модуле 5 про инфляцию.'],
  notes:{id:'prices',label:'Мои записи',ph:'Например: мама, 2005 год — мороженое стоило 10 ₽'}},
 {kind:'bridge',title:'Дальше: почему деньги работают',html:`<p>Сегодня большая часть денег — просто цифры на экране. Почему же за них дают настоящие вещи? И что будет, если напечатать денег побольше? Об этом последний урок модуля.</p>${nextCard('1.3','Почему деньги работают',20)}`},
]},

'm1-3':{num:'1.3',module:'Модуль 1. Что такое деньги',title:'Почему деньги работают',min:20,steps:[
 {kind:'hook',title:'Почему за бумажку дают пиццу?',html:`<div class="bill" aria-hidden="true"><span class="bill-k k-tl">1000</span><div class="bill-c"><b>1 000</b><span>рублей</span></div><span class="bill-k k-br">1000</span></div>
  <p class="lead">Купюра в 1 000 ₽ — это просто бумага. Её нельзя съесть, ей не согреешься.</p>
  <p class="lead">Но продавец спокойно отдаёт за неё пиццу. <b>Почему?</b></p>`},
 {kind:'learn',title:'Три работы денег',html:`<p>Деньги одновременно выполняют три работы:</p><div class="cards">
  <div class="card"><span class="token" aria-hidden="true">⇄</span><h3>Средство обмена</h3><p>Деньги принимают все. Не нужно искать сапожника, которому нужна рыба: продал, купил, готово.</p><span class="tag">Пример: платишь за обед в столовой.</span></div>
  <div class="card"><span class="token" aria-hidden="true">📏</span><h3>Мера стоимости</h3><p>Цену любой вещи можно выразить в рублях и сравнить. Кроссовки за 8 000 ₽ стоят как 10 пицц по 800 ₽.</p><span class="tag">Пример: сравниваешь цены в двух магазинах.</span></div>
  <div class="card"><span class="token" aria-hidden="true">⏳</span><h3>Средство сбережения</h3><p>Деньги можно отложить на потом, они не испортятся, как рыба. Правда, со временем немного дешевеют. Почему — узнаешь в модуле 5.</p><span class="tag">Пример: копишь на свою цель.</span></div></div>`},
 {kind:'play',title:'Сколько это в пиццах?',html:`<p>Деньги работают как общая линейка для цен. Выбери вещь и единицу и посмотри, сколько это.</p><div class="mount"></div>`,mount:mountPizza},
 {kind:'play',title:'Какая это работа денег?',gate:true,html:`<p>Шесть ситуаций. В каждой определи, какую работу выполняют деньги.</p><div class="mount"></div>`,mount:mountSorter},
 {kind:'learn',title:'Всё держится на доверии',html:`<p>Деньги работают, потому что все уверены: завтра их примут так же, как сегодня. Продавец берёт твою купюру, потому что знает, что сам сможет на неё что-то купить.</p>
  <div class="cards">
  <div class="card"><h3>Банк России</h3><p>Выпускает наличные рубли и следит, чтобы они не дешевели слишком быстро. Поэтому на купюрах написано «Билет Банка России».</p></div>
  <div class="card"><h3>«Гознак»</h3><p>Печатает купюры и чеканит монеты по заказу Банка России.</p></div>
  <div class="card"><h3>Защита от подделок</h3><p>Водяные знаки, защитная нить, рельеф, микротекст. Нарисовать деньги дома не получится, а за подделку грозит уголовное наказание.</p></div></div>
  <div class="callout">Обычные банки наличные деньги не печатают. Наличные рубли выпускает только Банк России.</div>`},
 {kind:'play',title:'А если напечатать больше денег?',html:`<p>В городе пекут 10 пицц в день. У жителей на всех 10 000 ₽. Что будет, если напечатать ещё денег и раздать всем? Двигай ползунок.</p><div class="mount"></div>`,mount:mountPrinter},
 {kind:'example',title:'Когда доверие пропадает',html:`<div class="cards">
  <div class="card"><span class="eyebrow">Германия, 1923</span><p>Правительство печатало деньги без остановки. В ноябре 1923 года буханка хлеба стоила около 200 миллиардов марок. Зарплату выдавали по два раза в день, чтобы люди успели её потратить до нового подорожания.</p></div>
  <div class="card"><span class="eyebrow">Зимбабве, 2009</span><p>Цены росли так быстро, что выпустили купюру в 100 триллионов зимбабвийских долларов. Вскоре от своей валюты стране пришлось отказаться.</p></div>
  <div class="card"><span class="eyebrow">Твоя игра</span><p>Если разработчики раздадут всем игрокам по миллиону монет, цены на внутриигровом рынке взлетят. Поэтому создатели игр следят за количеством монет так же, как Банк России за рублём.</p></div></div>`},
 {kind:'quiz',q:'Ты сравниваешь цены наушников в двух магазинах. Какую работу выполняют деньги?',opts:['Средство обмена','Мера стоимости','Средство сбережения'],a:1,ex:'Рубли — общая линейка для цен. Без неё пришлось бы сравнивать наушники в рыбах и горшках.'},
 {kind:'quiz',q:'Почему продавец берёт бумажную купюру, хотя сама бумага почти ничего не стоит?',opts:['В купюре спрятано немного золота','Все уверены, что эту купюру примут и завтра','Купюру очень дорого напечатать'],a:1,ex:'Деньги держатся на доверии. За рублём следит Банк России, и люди уверены, что смогут на него что-то купить.'},
 {kind:'quiz',q:'Кто выпускает наличные рубли в России?',opts:['Любой банк','Банк России','Каждый регион сам'],a:1,ex:'Наличные рубли выпускает только Банк России. Печатает их «Гознак» по его заказу.'},
 {kind:'quiz',q:'Денег у всех стало в 2 раза больше, а товаров столько же. Что произойдёт?',opts:['Все станут в 2 раза богаче','Цены вырастут','Ничего не изменится'],a:1,ex:'Товаров не прибавилось, поэтому за них начнут просить больше денег. Рост цен называется инфляцией.'},
 {kind:'mission',title:'Проверь купюру',tasks:['Возьми купюру 100 или 1 000 ₽ и найди три защитных признака: водяной знак (посмотри на свет), защитную нить и рельеф (проведи пальцем).','Спроси родителей, как они получают зарплату: наличными или на карту, и почему им так удобнее.']},
 {kind:'sheet',title:'Шпаргалка модуля 1',items:[
  ['Бартер','Обмен вещи на вещь без денег. Неудобен: трудно найти партнёра, вещи не делятся и портятся, непонятно, сколько что стоит.'],
  ['Деньги','Вещь, которую согласны принимать все. Путь: ракушки и меха → монеты → бумажные деньги → карты → телефон → цифровой рубль.'],
  ['Три работы денег','Средство обмена (платим), мера стоимости (сравниваем цены), средство сбережения (откладываем на потом).'],
  ['Доверие','Деньги работают, потому что все уверены: их примут и завтра. Наличные рубли выпускает Банк России.'],
  ['Больше денег ≠ богаче','Если денег напечатать больше, а товаров столько же, цены растут. Это инфляция. Подробно — в модуле 5.']]},
 {kind:'bridge',title:'Модуль 1 пройден',html:`<p>Ты знаешь, что такое деньги и почему они работают. Следующий вопрос: откуда деньги берутся у конкретного человека? Почему одни получают 40 000 ₽ в месяц, а другие 400 000 ₽?</p>
  <div class="next-card"><span class="eyebrow">Следующий модуль</span><b>2 · Откуда берутся деньги</b><span class="small muted">Скоро. А пока выполни задания из уроков: они пригодятся дальше.</span></div>`},
]},
};

/* ---------- урок ---------- */
const app=$('#app');
let cur={id:null,i:0};
function openLesson(id){cur.id=id;const n=LESSONS[id].steps.length;cur.i=Math.min(S.pos[id]||0,n-1);renderLesson();}
function go(i){cur.i=i;S.pos[cur.id]=i;save();renderLesson();window.scrollTo(0,0);}
function setGate(open,hint){const n=$('#next');n.disabled=!open;$('#gate-hint').textContent=open?'':(hint||'');}
function renderLesson(){
 const id=cur.id,L=LESSONS[id],st=L.steps[cur.i],last=cur.i===L.steps.length-1,key=id+':'+cur.i;
 let title=st.title,body='';
 if(st.kind==='quiz'){const qs=L.steps.filter(s=>s.kind==='quiz');title=`Вопрос ${qs.indexOf(st)+1} из ${qs.length}`;
  body=`<p class="q">${st.q}</p><div class="opts">${st.opts.map((o,k)=>`<button type="button" class="opt" data-k="${k}">${o}</button>`).join('')}</div><div class="explain" id="qx" aria-live="polite" hidden></div>`;}
 else if(st.kind==='mission'){const mk='mis-'+id+'-'+cur.i;
  body=`${st.intro?`<p>${st.intro}</p>`:''}${st.mount?'<div class="mount"></div>':''}<ul class="tasks">${st.tasks.map(t=>`<li><span>${t}</span></li>`).join('')}</ul>
  ${st.notes?`<label class="notes-l" for="notes-${st.notes.id}">${st.notes.label}</label><textarea id="notes-${st.notes.id}" placeholder="${st.notes.ph}"></textarea>`:''}
  <label class="done-check" for="${mk}"><input type="checkbox" id="${mk}" ${S.missions[key]?'checked':''}> Задание выполнено</label>
  <p class="small muted" style="margin:6px 0 0">Можно сделать позже и вернуться отметить.</p>`;}
 else if(st.kind==='sheet'){body=`<div class="sheet">${st.items.map(([h,t])=>`<div class="sheet-row"><b>${h}</b><p>${t}</p></div>`).join('')}</div>`;}
 else body=typeof st.html==='function'?st.html():st.html;
 app.innerHTML=`<div class="lesson">
  <div class="l-head"><a class="back" href="#map">← Карта курса</a><span class="l-meta">${L.module} · Урок ${L.num} · ~${L.min} мин</span></div>
  <h1 class="l-title">${L.title}</h1>
  <ol class="segs" aria-label="Шаг ${cur.i+1} из ${L.steps.length}">${L.steps.map((s,k)=>`<li class="seg${k<cur.i?' done':''}${k===cur.i?' now':''}" title="${KIND[s.kind]}"></li>`).join('')}</ol>
  <article class="step k-${st.kind}"><span class="chip">${KIND[st.kind]}</span><h2 tabindex="-1" id="step-h">${title}</h2><div class="step-body">${body}</div></article>
  <div class="lnav"><button type="button" class="btn ghost" id="prev" ${cur.i===0?'disabled':''}>Назад</button><span class="gate-hint" id="gate-hint"></span><button type="button" class="btn primary" id="next">${last?'Завершить урок':'Дальше'}</button></div></div>`;
 const api={key,unlock(){if(!S.gates[key]){S.gates[key]=true;save();}setGate(true);}};
 const need=st.kind==='quiz'?!(key in S.quiz):(st.gate?!S.gates[key]:false);
 setGate(!need,st.kind==='quiz'?'Сначала выбери ответ':'Сначала пройди задание');
 if(st.kind==='quiz')mountQuiz(st,key,api);
 if(st.kind==='mission'){
  const cb=$('#mis-'+id+'-'+cur.i);cb.addEventListener('change',()=>{S.missions[key]=cb.checked;save();if(cb.checked&&!S.mcoins[key]){S.mcoins[key]=true;save();addCoins(15,'задание');}});
  if(st.notes){const ta=$('#notes-'+st.notes.id);ta.value=S.notes[st.notes.id]||'';ta.addEventListener('input',()=>{S.notes[st.notes.id]=ta.value;save();});}}
 if(st.mount)st.mount($('.step-body .mount')||$('.step-body'),api);
 $('#prev').onclick=()=>go(cur.i-1);
 $('#next').onclick=()=>{if(last)finishLesson();else go(cur.i+1);};
 $('#step-h').focus({preventScroll:true});
}
function mountQuiz(st,key,api){
 const btns=[...document.querySelectorAll('.opt')];
 function show(k,fresh){btns.forEach((b,j)=>{b.disabled=true;if(j===st.a)b.classList.add('right');else if(j===k)b.classList.add('wrong');});
  const ok=k===st.a,x=$('#qx');x.hidden=false;x.className='explain '+(ok?'ok':'no');x.innerHTML=`<b>${ok?'Верно!':'Не совсем.'}</b> ${st.ex}`;if(fresh&&ok)addCoins(10,'верно');}
 if(key in S.quiz)show(S.quiz[key],false);
 btns.forEach(b=>b.onclick=()=>{const k=+b.dataset.k;S.quiz[key]=k;save();show(k,true);api.unlock();});
}
function finishLesson(){const id=cur.id;S.pos[id]=0;
 if(!S.done[id]){S.done[id]=true;save();addCoins(20,'урок пройден');}else save();
 const nx=ORDER[ORDER.indexOf(id)+1];location.hash=nx||'map';}

/* ---------- карта курса ---------- */
function stationHTML(m){
 const open=!!m.lessons,complete=open&&m.lessons.every(id=>S.done[id]);
 const nextId=ORDER.find(id=>!S.done[id]);
 const marker=complete?'✓':(m.n===0?PLAY_ICON:m.n);
 const inner=open?`<div class="lessons">${m.lessons.map(id=>{const L=LESSONS[id];return `<a class="lesson-btn${S.done[id]?' is-done':''}${id===nextId?' is-next':''}" href="#${id}"><span class="ln">${L.num}</span><span class="lt">${L.title}</span><span class="ls">${S.done[id]?'Пройден':'~'+L.min+' мин'}</span></a>`;}).join('')}</div>`
  :`<span class="soon">Скоро · ${m.count} ${plural(m.count,['урок','урока','уроков'])}</span>`;
 return `<li class="station ${open?'open':'locked'}${complete?' complete':''}"><div class="marker" aria-hidden="true">${marker}</div>
  <div class="st-body"><span class="eyebrow">${m.n===0?'Вступление':'Модуль '+m.n}</span><h3>${m.title}</h3><p class="st-q">${m.q}</p>${m.extra?`<p class="st-extra">${m.extra}</p>`:''}${inner}</div>
  ${m.bridge?`<div class="st-bridge"><span>${m.bridge}</span></div>`:''}</li>`;
}
function goalHTML(){
 if(!S.goal)return `<section class="goal empty"><div><span class="eyebrow">Моя цель</span><p style="margin-top:6px">Цель ещё не выбрана. Ты выберешь её в конце вступления: это вещь, на которую будешь копить, пока проходишь курс.</p></div></section>`;
 const g=S.goal,sv=S.saved||0,pct=Math.min(100,Math.round(sv/g.price*100));
 return `<section class="goal"><div><span class="eyebrow">Моя цель</span><h2>${esc(g.item)}</h2><p class="mono">${rub(g.price)} · ${rub(g.weekly)} в неделю · ${g.weeks} ${plural(g.weeks,['неделя','недели','недель'])}</p></div>
 <div class="goal-prog"><label for="saved-in">Уже отложено, ₽</label><input id="saved-in" type="number" inputmode="numeric" min="0" step="100" value="${sv||''}" placeholder="0"><div class="bar gold"><i id="goal-bar" style="width:${pct}%"></i></div><span class="small" id="goal-pct">${pct}% от цели${pct>=100?' — цель достигнута!':''}</span></div></section>`;
}
function renderMap(){
 const done=ORDER.filter(id=>S.done[id]).length,next=ORDER.find(id=>!S.done[id]);
 const cta=next?`<a class="btn primary" href="#${next}">${done===0?'Начать':'Продолжить'}: ${LESSONS[next].title} →</a>`:`<span class="btn ghost" aria-disabled="true">Модуль 1 пройден · модуль 2 скоро</span>`;
 app.innerHTML=`<section class="note">
  <canvas id="guil" aria-hidden="true"></canvas>
  <div class="note-in">
   <div class="note-top"><span class="eyebrow">Билет в мир финансов</span><span class="serial">ФГ 0000036</span></div>
   <h1>Деньги<br>с нуля</h1>
   <p class="note-sub">Курс финансовой грамотности: от того, что такое деньги, до акций и облигаций. 11 шагов, и каждый вытекает из предыдущего.</p>
   <label class="owner" for="owner-name"><span>Владелец</span><input id="owner-name" maxlength="30" placeholder="впиши своё имя" autocomplete="given-name"></label>
   <div class="note-prog"><div class="bar"><i style="width:${done/TOTAL*100}%"></i></div><span>Пройдено ${done} из ${TOTAL} уроков</span></div>
   ${cta}
  </div>
  <div class="denom" aria-hidden="true"><b>36</b><span>уроков</span></div>
 </section>
 ${goalHTML()}
 <section class="route-sec"><h2 class="sec-h">Маршрут курса</h2><p class="sec-sub">Каждый модуль отвечает на вопрос, который оставил предыдущий. Сейчас открыты вступление и модуль 1.</p>
  <ol class="route">${MODULES.map(stationHTML).join('')}</ol></section>
 <details class="parents"><summary>Для родителей: как проходить курс</summary>
  <ul>
   <li>Темп: 2–3 урока в неделю по 15–20 минут, лучше в одно и то же время.</li>
   <li>Каждый урок заканчивается заданием в жизни. Обсудите его вместе: знания закрепляются, когда их сразу применяют.</li>
   <li>Цель, которую ребёнок выбирает во вступлении, проходит через весь курс: бюджет, хранение, защита и инвестиции будут строиться вокруг неё.</li>
   <li>Курс рассчитан на 14 лет. В этом возрасте ребёнку можно оформить первую собственную карту: нужно ваше письменное согласие, банк присылает вам уведомления об операциях, а во многих банках можно поставить лимиты. Такая карта станет хорошим тренажёром для модулей о расходах, бюджете и банках.</li>
   <li>Монеты курса — очки за правильные ответы и задания. Настоящих денег за них нет.</li>
   <li>Прогресс хранится только в этом браузере на этом устройстве. На другом устройстве курс начнётся заново.</li>
  </ul>
  <p>Курс построен на Единой рамке компетенций по финансовой грамотности (Минфин России и Банк России), национальных стандартах финансового образования США и исследованиях о том, какое обучение финансам работает у подростков.</p>
  <button type="button" class="btn ghost small" id="reset">Сбросить прогресс</button>
 </details>`;
 const nm=$('#owner-name');nm.value=S.name||'';nm.addEventListener('input',()=>{S.name=nm.value.trim();save();});
 const si=$('#saved-in');if(si)si.addEventListener('input',()=>{S.saved=Math.max(0,+si.value||0);save();const pct=Math.min(100,Math.round(S.saved/S.goal.price*100));$('#goal-bar').style.width=pct+'%';$('#goal-pct').textContent=pct+'% от цели'+(pct>=100?' — цель достигнута!':'');});
 let armed=false;const rs=$('#reset');rs.onclick=()=>{if(!armed){armed=true;rs.textContent='Нажмите ещё раз, чтобы стереть всё';setTimeout(()=>{armed=false;if(document.body.contains(rs))rs.textContent='Сбросить прогресс';},4000);return;}
  S={name:'',coins:0,done:{},quiz:{},gates:{},missions:{},mcoins:{},goal:null,saved:0,notes:{},pos:{}};save();updateCoins();renderMap();toast('Прогресс сброшен');};
 drawGuil();
}

/* ---------- гильош на «банкноте» ---------- */
function drawGuil(){
 const cv=$('#guil');if(!cv)return;
 const size=cv.clientWidth||300,dpr=Math.min(2,window.devicePixelRatio||1);
 cv.width=size*dpr;cv.height=size*dpr;const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,size,size);
 const cs=getComputedStyle(document.documentElement);
 const c1=cs.getPropertyValue('--accent').trim()||'#0B7A64',c2=cs.getPropertyValue('--gold').trim()||'#C98A12';
 const h=size/2;c.lineWidth=.75;
 [{R:.84,A:.09,n:15,N:24,col:c1,a:.42},{R:.62,A:.10,n:11,N:20,col:c2,a:.6},{R:.38,A:.07,n:8,N:16,col:c1,a:.5}].forEach(g=>{
  c.strokeStyle=g.col;c.globalAlpha=g.a;
  for(let k=0;k<g.N;k++){const ph=k*2*Math.PI/g.N;c.beginPath();
   for(let i=0;i<=300;i++){const t=i/300*2*Math.PI,r=h*(g.R+g.A*Math.sin(g.n*t+ph));const px=h+r*Math.cos(t),py=h+r*Math.sin(t);i?c.lineTo(px,py):c.moveTo(px,py);}
   c.stroke();}});
 c.globalAlpha=1;
}
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(drawGuil,150);});
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',drawGuil);
new MutationObserver(drawGuil).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- маршрутизация ---------- */
function route(){const h=location.hash.slice(1);if(LESSONS[h])openLesson(h);else renderMap();window.scrollTo(0,0);}
window.addEventListener('hashchange',route);
updateCoins(false);route();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawGuil);
</script>

</body>
</html>
